<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamentos do HTML</title>
</head>

<body>
    <header>
        <h1 align="center">Título principal (H1) - Centralizado</h1>
        <h2 align="left">Subtítulo (H2) - Alinhado à esquerda</h2>
        <h3 align="right">Seção (H3) - Alinhado à direita</h3>
        <h4>Subseção (H4)</h4>
        <h5>Detalhe (H5)</h5>
        <h6>Nota (H6)</h6>
    </header>

    <nav>
        <p>
            <a href="#posts">Posts</a> |
            <a href="#lateral">Lateral</a> |
            <a href="#rodape">Rodapé</a>
        </p>
    </nav>

    <section id="posts">
        <article class="post">
            <header>
                <h2>Meu Blog - Primeiro Post</h2>
            </header>
        </article>
    </section>
</body>

</html>
